name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v
      # Rebuild the tidy table from the committed aggregate CSVs (no network)
      # and fail if it differs from the committed copy.
      - name: Tidy table is reproducible
        run: |
          python -m src.clean
          git diff --exit-code data/processed/
      - name: Notebook runs top to bottom
        run: jupyter nbconvert --to notebook --execute notebooks/analysis.ipynb --output /tmp/executed.ipynb
